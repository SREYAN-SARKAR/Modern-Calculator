# index.html

```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="A modern, responsive web calculator built with HTML, CSS and JavaScript."
    >
    <meta
        name="keywords"
        content="calculator, web calculator, HTML, CSS, JavaScript, frontend"
    >
    <meta name="author" content="Sreyan Sarkar">

    <title>Modern Calculator | Sreyan Sarkar</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="calculator-container">

        <section class="calculator" aria-label="Calculator">

            <!-- Calculator Header -->
            <header class="calculator-header">
                <span class="calculator-title">Calculator</span>

                <button
                    type="button"
                    id="theme-toggle"
                    class="theme-toggle"
                    aria-label="Toggle light and dark theme"
                    title="Toggle theme"
                >
                    ☀
                </button>
            </header>

            <!-- Display -->
            <div class="display-container">
                <div
                    id="previous-display"
                    class="previous-display"
                    aria-hidden="true"
                ></div>

                <input
                    type="text"
                    id="display"
                    class="display"
                    value="0"
                    readonly
                    aria-label="Calculator display"
                >
            </div>

            <!-- Calculator Buttons -->
            <div class="buttons" role="group" aria-label="Calculator buttons">

                <button
                    type="button"
                    class="button function"
                    data-action="clear"
                    aria-label="Clear"
                >
                    AC
                </button>

                <button
                    type="button"
                    class="button function"
                    data-action="delete"
                    aria-label="Delete last character"
                >
                    DE
                </button>

                <button
                    type="button"
                    class="button function"
                    data-action="percentage"
                    aria-label="Percentage"
                >
                    %
                </button>

                <button
                    type="button"
                    class="button operator"
                    data-value="/"
                    aria-label="Divide"
                >
                    ÷
                </button>

                <button type="button" class="button" data-value="7">7</button>
                <button type="button" class="button" data-value="8">8</button>
                <button type="button" class="button" data-value="9">9</button>

                <button
                    type="button"
                    class="button operator"
                    data-value="*"
                    aria-label="Multiply"
                >
                    ×
                </button>

                <button type="button" class="button" data-value="4">4</button>
                <button type="button" class="button" data-value="5">5</button>
                <button type="button" class="button" data-value="6">6</button>

                <button
                    type="button"
                    class="button operator"
                    data-value="-"
                    aria-label="Subtract"
                >
                    −
                </button>

                <button type="button" class="button" data-value="1">1</button>
                <button type="button" class="button" data-value="2">2</button>
                <button type="button" class="button" data-value="3">3</button>

                <button
                    type="button"
                    class="button operator"
                    data-value="+"
                    aria-label="Add"
                >
                    +
                </button>

                <button
                    type="button"
                    class="button zero"
                    data-value="0"
                >
                    0
                </button>

                <button
                    type="button"
                    class="button"
                    data-value="."
                    aria-label="Decimal point"
                >
                    .
                </button>

                <button
                    type="button"
                    class="button equals"
                    data-action="calculate"
                    aria-label="Calculate result"
                >
                    =
                </button>

            </div>

        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
```
